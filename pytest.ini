[pytest]
minversion = 7.0

# Core test directories to scan
testpaths =
    tests
    tests/unit
    tests/integration
    tests/simulation

# File, class, and function discovery rules
python_files = test_*.py *_test.py
python_classes = Test* *Tests
python_functions = test_*

# Default execution flags
addopts = 
    -v
    -rsxX
    --tb=short
    --strict-markers
    --strict-config
    --cov=aapp_mart
    --cov-report=term-missing
    --cov-report=xml:coverage.xml
    --cov-report=html:htmlcov

# Live CLI Logging (formats logs from Multi-Agent/Engine steps)
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] [%(name)s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Dedicated log file for simulation test runs
log_file = logs/pytest_simulation.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] [%(name)s] %(message)s (%(filename)s:%(lineno)s)
log_file_date_format = %Y-%m-%d %H:%M:%S

# Custom Markers tailored to AAPP-MART Subsystems
markers =
    unit: Fast and isolated unit tests
    integration: Subsystem integration tests (AAPP + MART + Engine)
    prediction: AI-powered attack path prediction engine tests (AAPP)
    simulation: Multi-agent red team execution tests (MART)
    graph: Threat graph modeling and knowledge graph operations
    slow: Heavy simulation steps or ML model inference tests

# Excluded directories from scanning
norecursedirs = 
    .git
    .tox
    .env
    venv
    env
    __pycache__
    build
    dist
    demo
    assets
    logs

# Warning management
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::UserWarning