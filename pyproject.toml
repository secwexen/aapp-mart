[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aapp-mart"
version = "0.0.1"
description = "AAPP-MART is a cybersecurity engine featuring AI-powered autonomous attack path prediction and multi-agent red team simulation. These features include adversary emulation, attack path analysis, threat modeling, security validation, risk assessment, and MITRE ATT&CK alignment."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

authors = [
  { name = "secwexen" }
]

keywords = [
  "python",
  "ai-powered",
  "cybersecurity",
  "offensive-security",
  "red-team",
  "security-automation",
  "ai-security",
  "security",
  "multi-agent-system",
  "mitre-attack",
  "attack-graph",
  "risk-scoring",
  "attack-simulation",
  "threat-simulation",
  "attack-path-prediction"
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: Apache-2.0 License",
  "Operating System :: OS Independent",
  "Topic :: Security"
]

dependencies = [
  "networkx>=3.2",
  "numpy>=1.26",
  "scipy>=1.17.1",
  "pandas>=2.1",
  "scikit-learn>=1.5.0",
  "joblib>=1.3",
  "graphviz>=0.20",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "anyio>=4.2",
  "sniffio>=1.3",
  "gunicorn>=26.2.0",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "orjson>=3.9",
  "httpx>=0.26",
  "requests>=2.32.4",
  "rich>=13.7",
  "tqdm>=4.66.3",
  "matplotlib>=3.8",
  "seaborn>=0.12",
  "pillow>=12.1.1",
  "cryptography>=50.0.1",
  "python-dotenv>=1.2.3",
  "pyopenssl>=26.4.0",
  "torch==2.14.0",
  "transformers>=5.17.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.1",
  "pytest-xdist>=3.5",
  "mypy>=1.10",
  "black>=24.0",
  "build>=1.2",
  "loguru>=0.7",
  "ruff>=0.4"
]

[project.urls]
Homepage = "https://github.com/secwexen/aapp-mart"
Repository = "https://github.com/secwexen/aapp-mart"

[project.entry-points.console_scripts]
aappmart = "aapp_mart.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aapp_mart = [
  "**/*.json",
  "**/*.yaml",
  "**/*.yml",
  "**/*.md",
  "**/*.txt",
  "SBOM.md",
  "LICENSE-3RD-PARTY.md",
]

[tool.pytest.ini_options]
addopts = "--cov=aapp_mart --cov-report=term-missing -n auto"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["aapp_mart"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
